<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplikasi Absensi Kelas</title>

<style>
    body{
        font-family: Arial, sans-serif;
        background: #f2f2f2;
        padding: 20px;
    }

    .container{
        max-width: 500px;
        background: white;
        padding: 20px;
        margin: auto;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    h2{
        text-align: center;
        color: #333;
    }

    input, select, button{
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        border-radius: 5px;
        border: 1px solid #ccc;
    }

    button{
        background: blue;
        color: white;
        border: none;
        cursor: pointer;
    }

    button:hover{
        background: darkblue;
    }

    table{
        width: 100%;
        margin-top: 20px;
        border-collapse: collapse;
    }

    table, th, td{
        border: 1px solid #999;
    }

    th, td{
        padding: 10px;
        text-align: center;
    }

    th{
        background: #007bff;
        color: white;
    }
</style>
</head>

<body>

<div class="container">
    <h2>Aplikasi Absensi Kelas</h2>

    <input type="text" id="nama" placeholder="Masukkan Nama">

    <input type="text" id="kelas" placeholder="Masukkan Kelas">

    <select id="status">
        <option value="Hadir">Hadir</option>
        <option value="Izin">Izin</option>
        <option value="Sakit">Sakit</option>
        <option value="Alpa">Alpa</option>
    </select>

    <button onclick="tambahAbsen()">Tambah Absensi</button>

    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>Nama</th>
                <th>Kelas</th>
                <th>Status</th>
                <th>Waktu</th>
            </tr>
        </thead>

        <tbody id="dataAbsen">

        </tbody>
    </table>
</div>

<script>
let nomor = 1;

function tambahAbsen(){

    let nama = document.getElementById("nama").value;
    let kelas = document.getElementById("kelas").value;
    let status = document.getElementById("status").value;

    if(nama == "" || kelas == ""){
        alert("Nama dan kelas harus diisi!");
        return;
    }

    let waktu = new Date().toLocaleTimeString();

    let tabel = document.getElementById("dataAbsen");

    tabel.innerHTML += `
        <tr>
            <td>${nomor++}</td>
            <td>${nama}</td>
            <td>${kelas}</td>
            <td>${status}</td>
            <td>${waktu}</td>
        </tr>
    `;

    document.getElementById("nama").value = "";
    document.getElementById("kelas").value = "";
}
</script>

<html>
<body>
<script>
